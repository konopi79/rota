# Dependency updates. Every merge to main deploys (rock8), so updates come as one grouped PR
# a week that CI checks first; majors one by one, as they may need code changes.
# Security fixes come as PRs of their own as soon as an advisory appears (repository setting).
version: 2
updates:
  - package-ecosystem: bun
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      actions:
        patterns: ['*']
