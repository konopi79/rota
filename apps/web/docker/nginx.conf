server {
    listen 3030;
    server_name _;
    root /usr/share/nginx/html;

    # Behind the platform's proxy: keep redirects relative so they never point at
    # the internal host or port.
    absolute_redirect off;
    server_tokens off;

    # One canonical address: an app saved to the home screen belongs to the exact host it
    # was saved from (its own storage, its own updates), so www must never become a
    # second copy. rota.rock8cloud.app keeps serving the app — apps already installed
    # from it would stop updating behind a redirect.
    if ($host = www.rotapp.cz) {
        return 301 https://rotapp.cz$request_uri;
    }

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml
               application/manifest+json text/plain;

    # `add_header` in a location replaces every header set at server level, so each
    # location includes the security headers itself.

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # Content-hashed build assets never change under the same name.
    location /_next/static/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Card images are named by card code, not by content hash — a regenerated card
    # keeps its name, so cache for a day only (offline copies are the service
    # worker's job, R5).
    location /cards/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=86400";
    }

    # The service worker must always be revalidated, or an update never reaches
    # installed apps.
    location = /sw.js {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
    }

    # nginx's mime.types has no entry for .webmanifest; with `nosniff` the browser would
    # get application/octet-stream and may ignore the manifest.
    location = /manifest.webmanifest {
        include /etc/nginx/snippets/security-headers.conf;
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # Pages: the static export writes `/foo` as `foo.html`.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/index.html =404;
    }

    error_page 404 /404.html;
}
